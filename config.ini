# HPCF processing control file
# The package identifies a stable displacement-waveform score using AIC and
# estimates the corresponding high-pass corner frequency (HPCF).

[FAS_Parameters]
FAS_outdir = OUTPUT/01_fas  # Stage-1 FAS and smoothed-spectrum output.

[EM_Score_Parameters]
fmax = 10            # Maximum frequency (Hz) used in the EM representation.
w0 = 15              # Central frequency parameter used by the EM calculation.
total = 0            # Number of records to process; 0 processes all records.
N_process = 10       # Number of outer worker processes.
need_downsample = 1  # 1 enables dynamic downsampling; 0 disables it.

[AIC_Parameters]
Norm_EM_diff = 0          # Reserved normalization switch; 0 keeps raw EM differences.
C = 0.000001              # Small positive stabilizer used in the AIC variance terms.
nn = 1                    # AIC weighting coefficient; 1 applies no extra weighting.
add_dis_Head_Tail_limit = 0  # Reserved head/tail limit switch; 0 disables it.

[General_Parameters]
Earthquake_name = wenchuan

[Paths]
root_dir = .
in_dir = input/acceleration_records
station_metadata = input/station_metadata.csv
aic_dir = 03_aic_diagnostic_plots
outdir_em = 02_em_curves
